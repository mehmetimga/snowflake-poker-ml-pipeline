services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: poker-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      # EXTERNAL on 9092 for host clients; INTERNAL on 9094 for other compose services; CONTROLLER on 9093.
      KAFKA_LISTENERS: "INTERNAL://:9094,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9094,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: poker-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres-cdc:
    image: postgres:17.5-bookworm
    container_name: poker-postgres-cdc
    profiles: ["cdc-sim"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: poker_sim
      POSTGRES_USER: poker_sim
      POSTGRES_PASSWORD: poker_sim
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    volumes:
      - postgres_cdc_data:/var/lib/postgresql/data
      - ./infra/simulation/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker_sim -d poker_sim"]
      interval: 2s
      timeout: 3s
      retries: 30

  debezium-connect:
    image: quay.io/debezium/connect:3.6
    container_name: poker-debezium-connect
    profiles: ["cdc-sim"]
    depends_on:
      kafka:
        condition: service_started
      postgres-cdc:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9094
      GROUP_ID: poker-debezium-connect-sim-v1
      CONFIG_STORAGE_TOPIC: poker.sim.connect-configs.v1
      OFFSET_STORAGE_TOPIC: poker.sim.connect-offsets.v1
      STATUS_STORAGE_TOPIC: poker.sim.connect-statuses.v1
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      REST_HOST_NAME: 0.0.0.0

  generator:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: poker-generator
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9094"
      KAFKA_HANDS_TOPIC: "hands.raw"
    command: ["python", "scripts/generate.py", "--hands", "5000", "--players", "200", "--pairs", "30", "--out", "kafka"]
    restart: "no"
    profiles: ["pipeline"]

  stream-consumer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: poker-stream-consumer
    depends_on:
      - kafka
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9094"
    volumes:
      - ./data:/app/data
    command: ["python", "scripts/stream.py", "--max-messages", "5000"]
    restart: "no"
    profiles: ["pipeline"]

  trainer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: poker-trainer
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: ["python", "scripts/train.py"]
    restart: "no"
    profiles: ["pipeline"]

  admin:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: poker-admin
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: ["streamlit", "run", "admin/Home.py", "--server.address=0.0.0.0", "--server.port=8501"]
    profiles: ["pipeline"]

  flink-jobmanager:
    image: apache/flink:1.19.1-scala_2.12-java17
    container_name: poker-flink-jobmanager
    profiles: ["flink"]
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1

  flink-taskmanager:
    image: apache/flink:1.19.1-scala_2.12-java17
    container_name: poker-flink-taskmanager
    profiles: ["flink"]
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1

volumes:
  qdrant_storage:
  postgres_cdc_data:
