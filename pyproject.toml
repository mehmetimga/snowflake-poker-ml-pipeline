[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowflake-poker-ml-pipeline"
version = "0.1.0"
description = "End-to-end demo ML pipeline for poker collusion detection on Snowflake (with local DuckDB mode)."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["pipeline*"]
exclude = ["tests*", "scripts*", "admin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
